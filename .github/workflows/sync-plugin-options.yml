name: Sync Plugin Build Options

# Keeps the `plugin` choice list in build-release.yml in sync with the dirs
# under plugins/ (any dir containing CMakeLists.txt). Runs on pushes that add
# or remove plugins, or manually.

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Regenerate plugin options
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys

          wf = pathlib.Path(".github/workflows/build-release.yml")
          text = wf.read_text(encoding="utf-8")

          plugins = sorted(
              d.name for d in pathlib.Path("plugins").iterdir()
              if d.is_dir() and (d / "CMakeLists.txt").exists()
          )
          block = "\n".join(f"          - {p}" for p in plugins)

          new, n = re.subn(
              r"(# PLUGIN_OPTIONS_BEGIN\n).*?(          # PLUGIN_OPTIONS_END)",
              lambda m: m.group(1) + block + "\n" + m.group(2),
              text,
              flags=re.S,
          )
          if n == 0:
              sys.exit("PLUGIN_OPTIONS markers not found in build-release.yml")
          wf.write_text(new, encoding="utf-8", newline="\n")
          print("plugins:", ", ".join(plugins))
          EOF

      - name: Commit if changed
        run: |
          if git diff --quiet .github/workflows/build-release.yml; then
            echo "options already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-release.yml
          git commit -m "ci: sync build-release.yml plugin options with plugins/ [skip ci]"
          git push
