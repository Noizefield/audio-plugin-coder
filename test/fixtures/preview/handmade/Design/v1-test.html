<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HandmadeFixture</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #202830; }
  .box { position: absolute; left: 10%; top: 10%; width: 40%; height: 30%; background: #ffc300; }
  .pulse { position: absolute; right: 10%; bottom: 10%; width: 20%; height: 20%; background: #33ff33;
           animation: blink 0.3s infinite alternate; }
  @keyframes blink { from { opacity: 1; } to { opacity: 0.1; } }
</style>
</head>
<body>
<div class="box"></div>
<div class="pulse"></div>
</body>
</html>
