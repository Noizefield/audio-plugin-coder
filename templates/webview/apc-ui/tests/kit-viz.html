<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<title>APC UI kit viz self-test</title>
<!-- Self-test for apc-viz.js / apc-viz.css / apc-mock-viz.js (graph, envelope, spectrum, waveform, scope, meter,
     stepseq, xypad, picture). Uses an in-page spy bridge (harness-viz.js): independent of apc-bridge.js / apc-mock.js.
     Result: window.__APC_TEST__ = { pass, fail, failures } and <pre id="apc-test-result">.
     Demo / screenshot mode:  tests/kit-viz.html?demo=1[&theme=day]  (runs tests/kit-viz-demo.js instead of the tests). -->
<link rel="stylesheet" href="../apc-core.css">
<link rel="stylesheet" href="../apc-viz.css">
<style>
/* token fixture: the viz line/accent colours are deliberately distinctive so pixel assertions are unambiguous.
   Everything else equals design_library/apc-minimal/tokens.css (night + day). */
:root { --cols: 50; --rows: 27.5; }
:root, [data-theme="night"] {
  --surface:#0B0B0B; --plate:#121211; --plate-2:#1A1917; --inset:#0B0B0B; --rule:#3D3A33; --rule-2:#2A2823; --ink:#EDEAE0; --ink-2:#8A877E;
  --accent:#FF9500; --accent-ink:#000; --ok:#33FF33; --apc-danger:#FF5A4D; --apc-focus: var(--accent);
  --viz-line: rgb(10, 200, 30); --viz-accent: var(--accent); --viz-fill: rgba(255,149,0,.16); --viz-grid: var(--rule-2); --viz-axis: var(--ink-2);
  --viz-1:#FF9500; --viz-2:#56B4E9; --viz-3:#009E73; --viz-4:#F0E442;
  --meter-ok: var(--ok); --meter-warn:#F0E442; --meter-clip: var(--apc-danger); --led-on: var(--accent); --led-off: var(--rule-2);
  --step-off: var(--inset); --step-on: var(--accent); --step-accent: var(--ink); --step-playhead: var(--ok);
  --apc-mod-1:#e69f00; --apc-mod-2:#56b4e9; --apc-mod-3:#009e73; --apc-mod-4:#f0e442; --apc-mod-5:#3d9be0; --apc-mod-6:#d55e00; --apc-mod-7:#cc79a7; --apc-mod-8:#b8b8b8;
  --stroke:1px; --stroke-2:2px; --disabled-opacity:.4;
  --font-ui: Consolas, "Cascadia Mono", Menlo, "DejaVu Sans Mono", ui-monospace, monospace;
  --t-micro:max(9px,.5rem); --t-label:max(10px,.625rem); --t-value:max(11px,.6875rem); --label-spacing:.12em;
}
[data-theme="day"] {
  --surface:#E6E4DB; --plate:#FAFAF7; --plate-2:#F0EFE8; --inset:#E9E7DF; --rule:#1A1A1A; --rule-2:#C9C6BA; --ink:#141414; --ink-2:#5F5C54;
  --accent:#B85F00; --accent-ink:#FFF; --ok:#166A2E; --apc-danger:#B3261E;
  --viz-line: rgb(200, 30, 60); --viz-fill: rgba(184,95,0,.16);
  --viz-1:#B85F00; --viz-2:#0B6FA8; --viz-3:#00765A; --viz-4:#7F7400; --meter-warn:#7F7400;
}
.apc-plate { background: var(--plate); }
</style>
</head>
<body>
<div id="plate" class="apc-plate"></div>
<script>window.APC_MOCKVIZ_AUTOSTART = false;</script>
<script src="../apc-fit.js"></script>
<script src="../apc-kit.js"></script>
<script src="harness-viz.js"></script>
<script src="../apc-viz.js"></script>
<script src="../apc-mock-viz.js"></script>
<script>
if (/[?&]demo=1/.test(location.search)) {
  document.write('<script src="kit-viz-demo.js"><\/script>');
}
</script>
<script>
(function () {
  "use strict";
  if (/[?&]demo=1/.test(location.search)) return;
  var APC = window.APC, H = window.H, M = H.mock, viz = APC.viz, test = H.test, assert = H.assert, eq = H.eq, near = H.near, sleep = H.sleep;
  var gearJson = function (o) { return JSON.stringify(o); };
  function setTheme(t) { document.documentElement.setAttribute("data-theme", t); }
  function cvOf(el) { return el.querySelector("canvas.apc-viz-cv"); }
  function lastCall(name, id) { var l = M.of(name, id); return l.length ? l[l.length - 1] : null; }
  function paramVal(id) { var c = lastCall("apc.param.set", id); return c ? c.args.value : undefined; }
  function errorsDuring(fn) {
    var got = [], off = APC.on("error", function (e) { got.push(e); });
    return Promise.resolve(fn(got)).then(function () { off(); return got; }, function (e) { off(); throw e; });
  }
  var NIGHT = "night", DAY = "day";

  /* ===================================================================== registry / API surface */
  test("all viz names are registered and APC.viz exposes its API", function () {
    var names = APC.components();
    ["graph", "envelope", "spectrum", "waveform", "scope", "meter", "stepseq", "xypad", "picture"].forEach(function (n) { assert(names.indexOf(n) >= 0, "registered: " + n); });
    ["biquadResponse", "raf", "flush", "debug", "subscribe", "push", "setReducedMotion", "refreshTheme", "get"].forEach(function (k) { assert(typeof viz[k] !== "undefined", "APC.viz." + k); });
    assert(typeof APC.mockViz.start === "function" && typeof APC.mockViz.stop === "function", "APC.mockViz start/stop");
  });

  /* ===================================================================== biquadResponse */
  test("biquadResponse: RBJ cookbook shapes", function () {
    var f = [20, 1000, 20000];
    var pk = viz.biquadResponse("peak", 1000, 1, 6, 48000, f);
    near(pk[1], 6, 0.05, "peak gain at f0"); near(pk[0], 0, 0.3, "peak far below"); near(pk[2], 0, 0.3, "peak far above");
    var lp = viz.biquadResponse("lowpass", 1000, 0.7071, 0, 48000, [10, 1000, 10000]);
    near(lp[0], 0, 0.05, "lowpass passband"); near(lp[1], -3.01, 0.1, "lowpass -3 dB at fc"); assert(lp[2] < -30, "lowpass stopband " + lp[2]);
    var hp = viz.biquadResponse("highpass", 1000, 0.7071, 0, 48000, [100, 1000, 10000]);
    near(hp[1], -3.01, 0.1, "highpass -3 dB at fc"); assert(hp[0] < -30, "highpass stopband"); near(hp[2], 0, 0.5, "highpass passband");
    var ls = viz.biquadResponse("lowshelf", 200, 0.7071, 9, 48000, [20, 20000]);
    near(ls[0], 9, 0.2, "lowshelf gain at LF"); near(ls[1], 0, 0.2, "lowshelf unity at HF");
    var hs = viz.biquadResponse("highshelf", 4000, 0.7071, -6, 48000, [100, 20000]);
    near(hs[0], 0, 0.2, "highshelf unity at LF"); near(hs[1], -6, 0.5, "highshelf gain at HF");
    var bp = viz.biquadResponse("bandpass", 1000, 2, 0, 48000, [1000, 100]);
    near(bp[0], 0, 0.05, "bandpass 0 dB peak"); assert(bp[1] < -15, "bandpass skirt");
    var nt = viz.biquadResponse("notch", 1000, 4, 0, 48000, [1000, 200]);
    assert(nt[0] < -60, "notch null " + nt[0]); near(nt[1], 0, 0.5, "notch passband");
    assert(viz.biquadResponse("peak", 1000, 1, 3, 48000, new Float32Array([1000])) instanceof Float32Array, "typed in -> Float32Array out");
    assert(Array.isArray(viz.biquadResponse("peak", 1000, 1, 3, 48000, [1000])), "array in -> array out");
    var ls2 = viz.logSpace(20, 20000, 5);
    near(ls2[0], 20, 1e-3, "logSpace start"); near(ls2[4], 20000, 0.1, "logSpace end"); near(ls2[2], 632.45, 0.5, "logSpace middle (geometric)");
  });

  /* ===================================================================== graph */
  test("graph: structure, aria, canvas sized to its cell, tokens at draw time (night) + redraw on theme change (day)", async function () {
    var el = await H.mk("graph", { "data-label": "EQ response", "data-xscale": "log", "data-xmin": "20", "data-xmax": "20000", "data-ymin": "-18", "data-ymax": "18", "data-xunit": "Hz", "data-yunit": "dB" }, { x: 2, y: 2, w: 20, h: 10 });
    var g = el.__apcViz, cv = cvOf(el);
    assert(!!g && typeof g.setCurves === "function" && typeof g.setNodes === "function" && typeof g.setRange === "function" && typeof g.redraw === "function", "API on the element");
    eq(el.getAttribute("role"), "img", "no nodes -> role=img");
    assert(/EQ response/.test(el.getAttribute("aria-label")), "aria-label carries the label");
    g.setCurves([{ fn: function () { return 6; }, color: "line", label: "Flat" }]);
    H.flush();
    var r = el.getBoundingClientRect(), cr = cv.getBoundingClientRect();
    near(cr.width, r.width, 1, "canvas fills the cell (w)"); near(cr.height, r.height, 1, "canvas fills the cell (h)");
    near(cv.width, Math.round(cr.width * (window.devicePixelRatio || 1)), 2, "backing store = css box * dpr");
    var geo = g.geometry(), x = geo.mapX(300), y = geo.mapY(6);
    near(geo.mapX(1000) - geo.mapX(20), (geo.x1 - geo.x0) * (Math.log(1000 / 20) / Math.log(1000)), 0.5, "log10 x mapping");
    var night = H.rgb(H.tok(el, "--viz-line"));
    assert(H.hasColor(cv, x - 2, y - 2, x + 2, y + 2, night, 64), "curve pixel has the --viz-line colour (night) " + JSON.stringify(night));
    var grid = H.rgb(H.tok(el, "--viz-grid")), gx = geo.mapX(1000), gy = geo.mapY(-9) + 0;
    var hits = 0, xx;
    for (xx = Math.floor(gx) - 3; xx <= Math.floor(gx) + 3; xx++) { if (H.same(H.pixel(cv, xx + 0.5, geo.mapY(2.3)), grid, 3)) hits++; }
    eq(hits, 1, "decade grid line is exactly ONE device pixel wide (hairline, aligned)");
    assert(!H.hasColor(cv, x - 2, y - 2, x + 2, y + 2, H.rgb("#ff9500"), 10), "accent not used for a 'line' curve");
    var nAcc = H.countColor(cv, H.rgb(H.tok(el, "--viz-accent")), 4);
    eq(nAcc, 0, "no accent pixels on a plain graph");
    setTheme(DAY);
    await H.tick();
    H.flush();
    var day = H.rgb(H.tok(el, "--viz-line"));
    assert(!H.same(day, night, 30), "day token differs from night token");
    assert(H.hasColor(cv, x - 2, y - 2, x + 2, y + 2, day, 64), "curve re-coloured to the day token after data-theme change");
    assert(!H.hasColor(cv, x - 2, y - 2, x + 2, y + 2, night, 40), "night colour gone");
    var dayInset = H.rgb(H.tok(el, "--inset"));
    assert(H.same(H.pixel(cv, 8, 6), dayInset, 4) || H.same(H.pixel(cv, geo.x0 + 4, geo.y0 + 4), dayInset, 12), "background re-coloured (inset, day)");
    var s = g.getSummary();
    assert(/peak 6 dB at 20 Hz/.test(s), "text alternative summarises the curve: " + s);
  });

  test("graph: setCurves supports points, even values, fill; setRange and redraw", async function () {
    var el = await H.mk("graph", { "data-label": "Curves", "data-xmin": "0", "data-xmax": "10", "data-ymin": "0", "data-ymax": "1", "data-axes": "none" }, { x: 2, y: 2, w: 20, h: 8 });
    var g = el.__apcViz, cv = cvOf(el);
    g.setCurves([{ points: [[0, 0], [10, 1]], color: "accent", fill: true }, { values: [0.5, 0.5, 0.5], color: "2", dash: true }]);
    H.flush();
    var geo = g.geometry(), acc = H.rgb(H.tok(el, "--viz-accent")), v2 = H.rgb(H.tok(el, "--viz-2"));
    assert(H.hasColor(cv, geo.mapX(5) - 2, geo.mapY(0.5) - 3, geo.mapX(5) + 2, geo.mapY(0.5) + 3, acc, 60), "accent diagonal passes through the middle");
    assert(H.hasColor(cv, geo.x0 + 5, geo.mapY(0.5) - 2, geo.x1 - 5, geo.mapY(0.5) + 2, v2, 64), "series colour --viz-2 used for the 2nd curve");
    var fillPx = H.pixel(cv, geo.mapX(8), geo.mapY(0.1));
    assert(fillPx[0] > 15 && fillPx[0] < 80, "area under the line is tinted with --viz-fill: " + fillPx);
    g.setRange({ xmin: 0, xmax: 20 });
    H.flush(true);
    near(g.geometry().mapX(10), (g.geometry().x0 + g.geometry().x1) / 2, 0.6, "setRange moved the x axis");
    eq(g.getRange().xmax, 20, "getRange");
    eq(g.getCurves().length, 2, "getCurves");
  });

  test("graph: nodes (param round trip) - drag emits begin/set/end, hover tooltip, DOM semantics", async function () {
    var el = await H.mk("graph", { "data-label": "EQ", "data-xscale": "log", "data-xmin": "20", "data-xmax": "20000", "data-ymin": "-18", "data-ymax": "18", "data-xunit": "Hz", "data-yunit": "dB",
      "data-nodes": gearJson([{ id: "b1", x: "eq_f1", y: "eq_g1", q: "eq_q1", label: "1" }, { id: "b2", x: "eq_f2", y: "eq_g2", label: "2" }]) }, { x: 2, y: 2, w: 24, h: 12 });
    var g = el.__apcViz;
    H.flush();
    var nodes = el.querySelectorAll(".apc-viz-node");
    eq(nodes.length, 2, "two nodes in the DOM");
    eq(el.getAttribute("role"), "group", "role=group when it has nodes");
    var n1 = nodes[0];
    eq(n1.getAttribute("role"), "slider", "node role=slider"); eq(n1.getAttribute("tabindex"), "0", "node focusable");
    assert(/FREQ 1 kHz/.test(n1.getAttribute("aria-valuetext")) && /GAIN 0/.test(n1.getAttribute("aria-valuetext")) && /Q 0.71/.test(n1.getAttribute("aria-valuetext")), "aria-valuetext: " + n1.getAttribute("aria-valuetext"));
    eq(n1.getAttribute("aria-valuenow"), "1000", "valuenow = x");
    var geo = g.geometry(), er = el.getBoundingClientRect(), c = H.center(n1);
    near(c.x - er.left, geo.mapX(1000), 1.5, "node x placed by the log axis"); near(c.y - er.top, geo.mapY(0), 1.5, "node y placed by gain");
    /* hover -> tooltip + guides */
    H.pe(n1, "pointerenter", {});
    assert(!el.querySelector(".apc-viz-tip").hidden, "tooltip shown on hover");
    assert(/FREQ/.test(el.querySelector(".apc-viz-tip").textContent), "tooltip text " + el.querySelector(".apc-viz-tip").textContent);
    H.pe(n1, "pointerleave", {});
    assert(el.querySelector(".apc-viz-tip").hidden, "tooltip hidden after leave");
    /* drag */
    var n0 = M.calls.length;
    H.dragPath(n1, [[c.x, c.y], [c.x + 40, c.y - 10], [c.x + 90, c.y - 30]]);
    await H.tick(); await sleep(40);
    var names = M.names("eq_f1").slice(M.names("eq_f1").indexOf("p.get") + 1);
    assert(names[0] === "begin", "begin first: " + names.join(","));
    assert(names.indexOf("set") > 0 && names.lastIndexOf("set") < names.lastIndexOf("end"), "set between begin and end: " + names.join(","));
    eq(names[names.length - 1], "end", "end last (eq_f1)");
    var gn = M.names("eq_g1"); assert(gn.indexOf("begin") >= 0 && gn.indexOf("set") >= 0 && gn[gn.length - 1] === "end", "gain param gestures too: " + gn.join(","));
    var f1 = paramVal("eq_f1"), g1 = paramVal("eq_g1");
    assert(f1 > 1000 && f1 <= 20000, "frequency went up: " + f1);
    assert(g1 > 0 && g1 <= 18, "gain went up: " + g1);
    near(Math.log(f1 / 1000) / Math.log(20000 / 20), 90 / geo.w, 0.02, "drag delta maps through the log axis");
    eq(n1.getAttribute("aria-valuenow"), String(Math.round(f1 * 1e6) / 1e6), "aria-valuenow follows the drag");
    assert(!n1.classList.contains("is-drag"), "drag class removed");
  });

  test("graph: keyboard (arrows, shift fine, +/- Q), wheel = Q, Alt+click = reset, Delete = reset", async function () {
    var el = await H.mk("graph", { "data-xscale": "log", "data-xmin": "20", "data-xmax": "20000", "data-ymin": "-18", "data-ymax": "18", "data-xunit": "Hz", "data-yunit": "dB",
      "data-nodes": gearJson([{ id: "b1", x: "eq_f1", y: "eq_g1", q: "eq_q1", label: "1" }]) }, { x: 2, y: 2, w: 24, h: 12 });
    var n = el.querySelector(".apc-viz-node");
    n.focus();
    assert(!el.querySelector(".apc-viz-tip").hidden, "tooltip shown on focus");
    H.key(n, "ArrowRight"); await H.tick();
    var a = paramVal("eq_f1"); assert(a > 1000, "ArrowRight raises freq: " + a);
    var seq = M.names("eq_f1"); assert(seq.indexOf("begin") >= 0 && seq[seq.length - 1] === "end", "one complete gesture per key press: " + seq.join(","));
    M.find("eq_f1").value = 1000; M.emit("param", { id: "eq_f1", value: 1000 }); await H.tick();
    H.key(n, "ArrowRight", { shift: true }); await H.tick();
    var b = paramVal("eq_f1"); assert(b > 1000 && b < a, "Shift = fine step: " + b + " < " + a);
    H.key(n, "ArrowUp"); await H.tick(); assert(paramVal("eq_g1") > 0, "ArrowUp raises gain");
    H.key(n, "ArrowDown"); H.key(n, "ArrowDown"); await H.tick(); assert(paramVal("eq_g1") < 0, "ArrowDown lowers gain");
    H.key(n, "+"); await H.tick(); assert(paramVal("eq_q1") > 0.71, "+ raises Q: " + paramVal("eq_q1"));
    H.key(n, "-"); H.key(n, "-"); await H.tick(); assert(paramVal("eq_q1") < 0.71, "- lowers Q");
    var q0 = paramVal("eq_q1");
    var ev = H.wheel(n, -100); await H.sleep(300);
    assert(ev.defaultPrevented, "wheel on a node is captured");
    assert(paramVal("eq_q1") > q0, "wheel up raises Q: " + paramVal("eq_q1"));
    var qn = M.names("eq_q1"); eq(qn[qn.length - 1], "end", "wheel gesture is closed (end)");
    var n0 = M.calls.length;
    H.pe(n, "pointerdown", { alt: true }); await H.tick();
    var resets = M.calls.slice(n0).filter(function (c2) { return c2.name === "apc.param.reset"; }).map(function (c2) { return c2.args.id; });
    assert(resets.indexOf("eq_f1") >= 0 && resets.indexOf("eq_g1") >= 0 && resets.indexOf("eq_q1") >= 0, "Alt+click resets freq, gain and Q: " + resets.join(","));
    eq(n.getAttribute("aria-valuenow"), "1000", "node back at the default");
    H.key(n, "ArrowRight"); await H.tick();
    var n1 = M.calls.length;
    H.key(n, "Delete"); await H.tick();
    assert(M.calls.slice(n1).some(function (c2) { return c2.name === "apc.param.reset" && c2.args.id === "eq_f1"; }), "Delete resets the node");
    /* external host change moves the node */
    M.emit("param", { id: "eq_f1", value: 5000 }); await H.tick();
    eq(n.getAttribute("aria-valuenow"), "5000", "host automation moves the node");
  });

  test("graph: unknown param / modulation overlay / events", async function () {
    var errs = await errorsDuring(async function () {
      await H.mk("graph", { "data-nodes": gearJson([{ x: "nope_param", y: "eq_g1" }]) }, { x: 2, y: 2, w: 12, h: 6 });
      await H.tick();
    });
    assert(errs.length >= 1 && /nope_param/.test(errs[0].message), "unknown param is reported, never silent: " + (errs[0] && errs[0].message));
    var el2 = await H.mk("graph", { "data-xscale": "log", "data-xmin": "20", "data-xmax": "20000", "data-ymin": "-18", "data-ymax": "18",
      "data-nodes": gearJson([{ id: "m", x: "eq_f1", y: "eq_g1" }]) }, { x: 16, y: 2, w: 20, h: 10 });
    H.flush();
    var cv = el2.querySelector("canvas"), geo = el2.__apcViz.geometry();
    var m1 = H.rgb(H.tok(el2, "--apc-mod-1")), m2 = H.rgb(H.tok(el2, "--apc-mod-2")), m3 = H.rgb(H.tok(el2, "--apc-mod-3")), m4 = H.rgb(H.tok(el2, "--apc-mod-4")), m5 = H.rgb(H.tok(el2, "--apc-mod-5")), m6 = H.rgb(H.tok(el2, "--apc-mod-6")), m7 = H.rgb(H.tok(el2, "--apc-mod-7")), m8 = H.rgb(H.tok(el2, "--apc-mod-8"));
    var any = [m1, m2, m3, m4, m5, m6, m7, m8].some(function (col) { return H.hasColor(cv, geo.mapX(1000), geo.y0, geo.mapX(1000) + 14, geo.y1, col, 8); });
    assert(any, "gain modulation range (lfo1 40 %) is drawn beside the node in a modulation-source colour");
    var evs = [], off = APC.on("graph:node", function (d) { evs.push(d); });
    var node = el2.querySelector(".apc-viz-node"), c = H.center(node);
    H.dragPath(node, [[c.x, c.y], [c.x + 10, c.y + 10]]);
    off();
    eq(evs[0].phase, "begin", "graph:node begin"); eq(evs[evs.length - 1].phase, "end", "graph:node end");
    assert(evs.some(function (d) { return d.phase === "move" && d.node === "m"; }), "graph:node move carries the node id");
  });

  test("graph: viz event with id feeds curves; free (param-less) nodes; setNodes API", async function () {
    var el = await H.mk("graph", { "data-viz": "g-feed", "data-xmin": "0", "data-xmax": "1", "data-ymin": "0", "data-ymax": "1", "data-axes": "none" }, { x: 2, y: 2, w: 12, h: 6 });
    var g = el.__apcViz;
    APC.bridge._dispatch("viz", { id: "g-feed", data: { type: "curve", values: [0, 1, 0, 1], color: "line" } });
    eq(g.getCurves().length, 1, "viz {type:'curve'} -> one curve");
    APC.bridge._dispatch("viz", { id: "g-feed", data: { type: "curves", curves: [{ values: [0, 1] }, { values: [1, 0] }] } });
    eq(g.getCurves().length, 2, "viz {type:'curves'}");
    g.setNodes([{ id: "f", xv: 0.25, yv: 0.5 }]);
    var node = el.querySelector(".apc-viz-node"); assert(!!node, "free node created");
    H.flush(true);
    var got = []; var off = APC.on("graph:node", function (d) { got.push(d); });
    H.key(node, "ArrowRight"); off();
    assert(g.getNodes()[0].x > 0.25, "free node moved by keyboard: " + g.getNodes()[0].x);
    assert(got.length && got[got.length - 1].phase === "key", "event emitted for free nodes");
    eq(M.of("apc.param.set").length, 0, "free node does not touch the bridge");
    g.setNodeValue("f", { x: 0.9 });
    near(g.getNodes()[0].x, 0.9, 1e-9, "setNodeValue");
    g.setNodes([]);
    eq(el.querySelectorAll(".apc-viz-node").length, 0, "setNodes([]) removes nodes"); eq(el.getAttribute("role"), "img", "role back to img");
  });

  /* ===================================================================== envelope */
  test("envelope ADSR: nodes bound to 4 params, curve drawn in --viz-accent, drag decay/sustain, keyboard", async function () {
    var el = await H.mk("envelope", { "data-label": "Amp envelope", "data-attack": "env_a", "data-decay": "env_d", "data-sustain": "env_s", "data-release": "env_r", "data-tmax": "3" }, { x: 2, y: 2, w: 22, h: 10 });

    near(api.getState().level[0], -30, 1e-9, "reduced motion: level follows the data at once, no fall animation");
    near(api.getState().peak[0], -6, 1e-9, "peak hold still holds");
    api.step(16);
    near(api.getState().level[0], -30, 1e-9, "stays");
    var s = await H.mk("spectrum", { "data-viz": "rm2", "data-label": "RS" }, { x: 8, y: 2, w: 12, h: 6 });
    var started = APC.mockViz.start({ seed: 3 });
    eq(started, false, "mockViz.start() under reduced motion does not start a timer");
    eq(APC.mockViz.running(), false, "not running");
    assert(s.__apcViz.getState().frames === 1, "...but one static frame is delivered: " + s.__apcViz.getState().frames);
    await sleep(120);
    eq(s.__apcViz.getState().frames, 1, "no further frames");
  });

  test("APC.mockViz: seeded deterministic frames, step(), start/stop, subscriber-driven kinds", async function () {
    var got = [], off = viz.subscribe("mk1", "spectrum", function (d) { got.push(Array.prototype.slice.call(d.db, 0, 12)); }, { kind: "spectrum" });
    var mgot = [], off2 = viz.subscribe("mk2", "meter", function (d) { mgot.push(d.db.slice()); }, { kind: "meter" });
    var sgot = [], off3 = viz.subscribe("mk3", "stepseq", function (d) { sgot.push(d.step); }, { kind: "stepseq", length: 16 });
    var wgot = [], off4 = viz.subscribe("mk4", "waveform", function (d) { wgot.push(d.min.length); }, { kind: "waveform", mode: "scroll" });
    var stat = [], off5 = viz.subscribe("mk5", "waveform", function (d) { stat.push(1); }, { kind: "waveform", mode: "static" });
    APC.mockViz.seed(42); APC.mockViz.step(3);
    var run1 = JSON.stringify(got), m1 = JSON.stringify(mgot);
    eq(got.length, 3, "3 spectrum frames"); eq(mgot.length, 3, "3 meter frames"); eq(sgot.length, 3, "3 playhead frames"); eq(wgot[0], 24, "waveform columns"); eq(stat.length, 0, "static waveforms are not animated");
    got.length = 0; mgot.length = 0;
    APC.mockViz.seed(42); APC.mockViz.step(3);
    eq(JSON.stringify(got), run1, "same seed -> identical spectrum frames"); eq(JSON.stringify(mgot), m1, "same seed -> identical meter frames");
    got.length = 0; APC.mockViz.seed(43); APC.mockViz.step(1);
    assert(JSON.stringify(got[0]) !== JSON.parse(run1) && JSON.stringify(got[0]) !== JSON.stringify(JSON.parse(run1)[0]), "different seed -> different frame");
    var ok = APC.mockViz.start({ seed: 7, manual: true });
    eq(ok, true, "start() ok"); eq(APC.mockViz.running(), true, "running"); APC.mockViz.stop(); eq(APC.mockViz.running(), false, "stop()");
    got.length = 0;
    APC.mockViz.start({ seed: 7, fps: 30 });
    await sleep(200);
    assert(got.length >= 3, "timer-driven frames at ~30 fps: " + got.length);
    APC.mockViz.stop(); var n = got.length; await sleep(120);
    eq(got.length, n, "no frames after stop()");
    off(); off2(); off3(); off4(); off5();
    assert(viz.debug().subs === 0, "unsubscribed");
    /* real component driven by the mock */
    var sp = await H.mk("spectrum", { "data-viz": "mk6", "data-label": "Fed", "data-smoothing": "0" }, { x: 2, y: 2, w: 20, h: 8 });
    APC.mockViz.seed(1); APC.mockViz.step(2);
    assert(sp.__apcViz.getState().hasData && sp.__apcViz.getState().frames === 2, "spectrum fed by the mock feed");
    var peak = -200, i; for (i = 0; i < sp.__apcViz.getState().cols; i++) peak = Math.max(peak, sp.__apcViz.getState().cur[i]);
    assert(peak > -40 && peak <= 0, "mock spectrum looks like a spectrum: peak " + peak);
  });

  test("dispose: no observers, RAF, bridge listeners, canvases or DOM left behind", async function () {
    var made = [];
    made.push(await H.mk("graph", { "data-viz": "d1", "data-nodes": gearJson([{ x: "eq_f1", y: "eq_g1" }]) }, { x: 1, y: 1, w: 8, h: 5 }));
    made.push(await H.mk("spectrum", { "data-viz": "d2" }, { x: 10, y: 1, w: 8, h: 5 }));
    made.push(await H.mk("meter", { "data-meter": "d3" }, { x: 19, y: 1, w: 3, h: 5 }));
    made.push(await H.mk("waveform", { "data-viz": "d4" }, { x: 23, y: 1, w: 8, h: 5 }));
    made.push(await H.mk("stepseq", { "data-viz": "d5", "data-param": "seq_steps" }, { x: 32, y: 1, w: 12, h: 5 }));
    made.push(await H.mk("xypad", { "data-x": "xp_x", "data-y": "xp_y" }, { x: 1, y: 7, w: 8, h: 5 }));
    made.push(await H.mk("picture", { "data-alt": "d", "data-overlay": "spectrum", "data-viz": "d6" }, { x: 10, y: 7, w: 8, h: 5 }));
    made.push(await H.mk("envelope", { "data-attack": "env_a", "data-decay": "env_d", "data-sustain": "env_s", "data-release": "env_r" }, { x: 19, y: 7, w: 8, h: 5 }));
    var d = viz.debug();
    assert(d.views >= 7 && d.ro && d.io && d.mo, "observers active while mounted: " + JSON.stringify(d));
    assert(d.feeds >= 2 && d.subs >= 6, "bridge subscriptions registered: " + JSON.stringify(d));
    assert(M.listeners() >= 2, "bridge has listeners: " + M.listeners());
    made.forEach(function (e) { e.__apcViz.view && e.__apcViz.view.invalidate(); });
    assert(viz.debug().raf || viz.debug().queued > 0, "work is queued");
    made.forEach(function (e) { e.__apcViz.dispose(); });
    var z = viz.debug();
    eq(z.views, 0, "no views"); eq(z.ro, false, "ResizeObserver disconnected"); eq(z.io, false, "IntersectionObserver disconnected"); eq(z.mo, false, "MutationObservers disconnected");
    eq(z.raf, false, "no pending requestAnimationFrame"); eq(z.queued, 0, "queue empty"); eq(z.subs, 0, "no subscriptions"); eq(z.feeds, 0, "no feed hooks");
    eq(M.listeners(), 0, "bridge listener count back to 0");
    eq(document.querySelectorAll("canvas.apc-viz-cv, .apc-viz-node, .apc-viz-tip, .apc-viz-probe").length, 0, "no viz DOM left");
    var calls = M.calls.length; M.emit("param", { id: "eq_f1", value: 5 }); APC.bridge._dispatch("viz", { id: "d2", data: [1, 2] });
    eq(M.calls.length, calls, "disposed components ignore later events");
    var again = made[0].__apcViz; eq(again, null, "element API cleared");
  });
