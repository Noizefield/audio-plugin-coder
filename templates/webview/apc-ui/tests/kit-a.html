<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>APC UI kit-A self-test</title>
<!-- Self-test for apc-controls / apc-context / apc-help / apc-chrome.
     Uses an in-page spy bridge (harness-a.js) so it is independent of apc-bridge.js / apc-mock.js.
     Result: window.__APC_TEST__ = { pass, fail, failures } and <pre id="apc-test-result">.
     Headless: msedge --headless=new --disable-gpu --window-size=1000,700 --virtual-time-budget=60000 --dump-dom file:///.../kit-a.html -->
<link rel="stylesheet" href="../apc-core.css">
<link rel="stylesheet" href="../apc-components.css">
<style>:root { --cols: 50; --rows: 27.5; }</style>
</head>
<body>
<div id="plate" class="apc-plate"></div>
<script src="../apc-fit.js"></script>
<script src="../apc-kit.js"></script>
<script src="harness-a.js"></script>
<script src="../apc-controls.js"></script>
<script src="../apc-context.js"></script>
<script src="../apc-help.js"></script>
<script src="../apc-chrome.js"></script>
<script>
(function () {
  "use strict";
  var APC = window.APC, H = window.H, M = H.mock, test = H.test, assert = H.assert, eq = H.eq, near = H.near, sleep = H.sleep;
  function sets() { return M.of("apc.param.set"); }
  function lastSet() { var s = sets(); return s.length ? s[s.length - 1].args.value : undefined; }
  function val(el) { return parseFloat(el.getAttribute("aria-valuenow")); }

  /* ---------------- structure / aria ---------------- */
  test("knob renders with role=slider, tabindex, aria-value*, label", async function () {
    var el = await H.mk("knob", "cutoff_hz", { "data-label": "CUTOFF" });
    eq(el.getAttribute("role"), "slider", "role");
    eq(el.getAttribute("tabindex"), "0", "tabindex");
    eq(el.getAttribute("aria-label"), "CUTOFF", "accessible name");
    eq(el.getAttribute("aria-valuemin"), "20", "valuemin");
    eq(el.getAttribute("aria-valuemax"), "20000", "valuemax");
    eq(el.getAttribute("aria-valuenow"), "850", "valuenow");
    assert(/850 Hz/.test(el.getAttribute("aria-valuetext")), "valuetext has unit: " + el.getAttribute("aria-valuetext"));
    eq(el.querySelector(".apc-readout").textContent, "850 Hz", "readout text");
    assert(!!el.querySelector(".apc-ring"), "svg ring present");
    eq(M.of("apc.params.get").length >= 1, true, "descriptor read through apc.params.get");
  });

  test("all four components have names + tabindex", async function () {
    var a = await H.mk("knob", "gain_db"), b = await H.mk("slider", "mix_pct"), c = await H.mk("selector", "wave"), d = await H.mk("toggle", "bypass");
    [a, b, c, d].forEach(function (e) {
      assert(e.getAttribute("tabindex") === "0", e.getAttribute("data-apc") + " tabindex");
      assert((e.getAttribute("aria-label") || "").length > 0, e.getAttribute("data-apc") + " has aria-label");
    });
    eq(d.getAttribute("role"), "switch", "toggle role");
    eq(c.getAttribute("aria-valuetext"), "Saw", "selector valuetext is the label");
  });

  /* ---------------- reset gestures ---------------- */
  test("Alt+click resets base value only (U-01)", async function () {
    var el = await H.mk("knob", "cutoff_hz");
    var n = M.calls.length;
    var ev = H.pe(el, "pointerdown", { alt: true });
    H.click(el, { alt: true });
    await H.tick();
    var after = H.callsSince(n).map(function (c) { return c.name; });
    assert(after.indexOf("apc.param.reset") >= 0, "apc.param.reset called: " + after.join(","));
    assert(!after.some(function (x) { return x.indexOf("apc.mod.") === 0; }), "no modulation call on reset");
    assert(ev.defaultPrevented, "alt pointerdown prevented");
    eq(el.getAttribute("aria-valuenow"), "1000", "value is the declared default");
    eq(M.find("cutoff_hz").modulation.length, 2, "routes untouched");
  });

  test("double-click = reset by default (U-02)", async function () {
    var el = await H.mk("knob", "gain_db");
    H.key(el, "End"); await H.tick();
    eq(val(el), 12, "moved to max");
    var n = M.calls.length;
    H.dbl(el); await H.tick();
    assert(H.callsSince(n).some(function (c) { return c.name === "apc.param.reset"; }), "reset called");
    eq(val(el), 0, "back to default");
    assert(!el.querySelector(".apc-entry"), "no value entry in reset mode");
  });

  test("double-click = value entry when ui.double_click=value_entry (U-15)", async function () {
    APC.prefs.set({ double_click: "value_entry" });
    var el = await H.mk("knob", "gain_db");
    var n = M.calls.length;
    H.dbl(el); await H.tick();
    assert(!!el.querySelector("input.apc-entry"), "inline entry opened");
    assert(!H.callsSince(n).some(function (c) { return c.name === "apc.param.reset"; }), "reset NOT called");
    eq(document.activeElement, el.querySelector("input.apc-entry"), "entry focused");
  });

  test("touch double-tap resets; long-press opens the context panel", async function () {
    var el = await H.mk("knob", "gain_db");
    H.key(el, "End"); await H.tick();
    var n = M.calls.length;
    H.pe(el, "pointerdown", { type: "touch" }); H.pe(el, "pointerup", { type: "touch" });
    H.pe(el, "pointerdown", { type: "touch" }); H.pe(el, "pointerup", { type: "touch" });
    await H.tick();
    eq(H.callsSince(n).filter(function (c) { return c.name === "apc.param.reset"; }).length, 1, "one reset from double-tap");
    H.pe(el, "pointerdown", { type: "touch", id: 5 });
    await sleep(650);
    assert(APC.context.isOpen(), "long-press opened the context panel");
  });

  /* ---------------- drag ---------------- */
  test("drag: 150 px = full range; Shift = 1/10; Ctrl = 1/100; modifiers latched at pointerdown", async function () {
    var el = await H.mk("knob", "gain_db");           /* linear -24..12 (range 36), starts at 0 */
    H.drag(el, -30); await H.tick();
    near(val(el), 7.2, 1e-6, "30 px up = +20 % of range");
    H.key(el, "Delete"); await H.tick();
    eq(val(el), 0, "delete key resets");
    H.drag(el, -30, { shift: true }); await H.tick();
    near(val(el), 0.72, 1e-6, "shift = fine (1/10)");
    H.key(el, "Delete"); await H.tick();
    H.drag(el, -30, { ctrl: true }); await H.tick();
    near(val(el), 0.072, 1e-6, "ctrl = super-fine (1/100)");
    H.key(el, "Delete"); await H.tick();
    H.drag(el, -30, { moveShift: true, moveAlt: true }); await H.tick();   /* modifiers pressed only AFTER pointerdown */
    near(val(el), 7.2, 1e-6, "modifiers ignored during an active drag");
    H.key(el, "Delete"); await H.tick();
    H.drag(el, 60); await H.tick();
    near(val(el), -14.4, 1e-6, "dragging down lowers the value");
  });

  test("drag emits exactly one begin ... set* ... end; a click emits none", async function () {
    var el = await H.mk("knob", "gain_db");
    var n = M.calls.length;
    H.pe(el, "pointerdown"); H.pe(el, "pointerup"); H.click(el); await H.tick();
    eq(M.names().slice(n).filter(function (x) { return /begin|end|\.set/.test(x); }).length, 0, "plain click: no gesture");
    n = M.calls.length;
    H.drag(el, -45); await H.tick();
    var seq = M.names().slice(n).filter(function (x) { return x.indexOf("apc.param.") === 0; });
    eq(seq[0], "apc.param.begin", "begin first");
    eq(seq[seq.length - 1], "apc.param.end", "end last");
    eq(seq.filter(function (x) { return x === "apc.param.begin"; }).length, 1, "single begin");
    eq(seq.filter(function (x) { return x === "apc.param.end"; }).length, 1, "single end");
    assert(seq.slice(1, -1).length >= 1 && seq.slice(1, -1).every(function (x) { return x === "apc.param.set"; }), "only set between: " + seq.join(","));
  });

  test("keyboard nudges wrap in begin/set/end; choice and stepped params move by one step", async function () {
    var el = await H.mk("knob", "gain_db"), n = M.calls.length;
    H.key(el, "ArrowUp"); await H.tick();
    near(val(el), 0.36, 1e-6, "arrow = 1 % of range");
    H.key(el, "ArrowUp", { shift: true }); await H.tick();
    near(val(el), 0.396, 1e-6, "shift+arrow = 0.1 %");
    H.key(el, "PageDown"); await H.tick();
    near(val(el), -3.204, 1e-6, "PageDown = -10 %");
    H.key(el, "Home"); await H.tick(); eq(val(el), -24, "Home = min");
    H.key(el, "End"); await H.tick(); eq(val(el), 12, "End = max");
    var seq = M.names().slice(n).filter(function (x) { return x.indexOf("apc.param.") === 0; });
    eq(seq.filter(function (x) { return x === "apc.param.begin"; }).length, seq.filter(function (x) { return x === "apc.param.end"; }).length, "begin/end balanced");
    var st = await H.mk("knob", "steps_n");
    H.key(st, "ArrowUp"); await H.tick(); eq(val(st), 6, "stepped +1");
    H.key(st, "ArrowDown", { shift: true }); await H.tick(); eq(val(st), 5, "stepped fine still 1 step");
    eq(lastSet(), 5, "bridge got 5");
  });

  /* ---------------- wheel ---------------- */
  test("wheel nudges 1 % (Shift 0.1 %), ends the host gesture after idle", async function () {
    var el = await H.mk("knob", "gain_db"), n = M.calls.length;
    var ev = H.wheel(el, -100);
    assert(ev.defaultPrevented, "wheel captured when not inside a scrollable panel");
    near(val(el), 0.36, 1e-6, "wheel up +1 %");
    H.wheel(el, 100, { shift: true });
    near(val(el), 0.324, 1e-6, "shift+wheel down -0.1 %");
    eq(M.names().slice(n).filter(function (x) { return x === "apc.param.end"; }).length, 0, "gesture still open");
    await sleep(320);
    eq(M.names().slice(n).filter(function (x) { return x === "apc.param.begin"; }).length, 1, "one begin for the whole wheel burst");
    eq(M.names().slice(n).filter(function (x) { return x === "apc.param.end"; }).length, 1, "end after idle");
    var st = await H.mk("knob", "steps_n");
    H.wheel(st, -100); eq(val(st), 6, "stepped param: one notch = one step");
    await sleep(300);
  });

  test("wheel inside a scrollable panel: captured only after 120 ms hover or with Shift; ui.wheel_target=panel", async function () {
    var panel = document.createElement("div");
    panel.style.cssText = "position:absolute;left:0;top:0;width:20rem;height:12rem;overflow:auto";
    var tall = document.createElement("div"); tall.style.cssText = "position:relative;height:60rem"; panel.appendChild(tall);
    H.plate().appendChild(panel);
    var el = document.createElement("div"); el.setAttribute("data-apc", "knob"); el.setAttribute("data-param", "gain_db");
    el.style.cssText = "position:absolute;left:2rem;top:2rem;width:5rem;height:6rem";
    tall.appendChild(el); var m = APC.mount(panel); await H.ready(el);
    el.dispatchEvent(new MouseEvent("mouseenter"));
    var e1 = H.wheel(el, -100);
    assert(!e1.defaultPrevented, "immediately after entering: not captured (panel scrolls)");
    var e2 = H.wheel(el, -100, { shift: true });
    assert(e2.defaultPrevented, "Shift captures immediately");
    await sleep(140);
    var e3 = H.wheel(el, -100);
    assert(e3.defaultPrevented, "after 120 ms hover: captured");
    el.dispatchEvent(new MouseEvent("mouseleave"));
    var e4 = H.wheel(el, -100);
    assert(!e4.defaultPrevented, "after leaving, hover timer resets");
    APC.prefs.set({ wheel_target: "panel" });
    el.dispatchEvent(new MouseEvent("mouseenter")); await sleep(140);
    assert(!H.wheel(el, -100).defaultPrevented, "wheel_target=panel: never captured without Shift");
    assert(H.wheel(el, -100, { shift: true }).defaultPrevented, "wheel_target=panel: Shift captures");
    await sleep(300);
    m.dispose();
  });

  /* ---------------- value entry ---------------- */
  async function openEntry(el) { H.click(el.querySelector(".apc-readout")); await H.tick(); return el.querySelector("input.apc-entry"); }
  test("click on readout -> text entry; Enter commits with units, locale and k suffix", async function () {
    var el = await H.mk("knob", "cutoff_hz");
    var inp = await openEntry(el);
    assert(!!inp, "entry opened"); eq(document.activeElement, inp, "entry focused"); eq(inp.value, "850 Hz", "prefilled with formatted value");
    inp.value = "1.2k"; H.key(inp, "Enter"); await H.tick();
    eq(lastSet(), 1200, "1.2k -> 1200"); assert(!el.querySelector(".apc-entry"), "entry closed");
    inp = await openEntry(el); inp.value = "1,5 kHz"; H.key(inp, "Enter"); await H.tick(); eq(lastSet(), 1500, "comma decimal + kHz");
    inp = await openEntry(el); inp.value = "850"; H.key(inp, "Enter"); await H.tick(); eq(lastSet(), 850, "bare number");
    eq(el.querySelector(".apc-readout").textContent, "850 Hz", "readout updated");
    var t = await H.mk("knob", "time_s");
    inp = await openEntry(t); inp.value = "250 ms"; H.key(inp, "Enter"); await H.tick(); near(lastSet(), 0.25, 1e-9, "ms into a seconds parameter");
  });

  test("value entry: Esc cancels; invalid input flashes red and keeps focus; out of range clamps with a hint", async function () {
    var el = await H.mk("knob", "cutoff_hz"), n;
    var inp = await openEntry(el);
    n = sets().length; inp.value = "9999"; H.key(inp, "Escape"); await H.tick();
    assert(!el.querySelector(".apc-entry"), "Esc closed the entry"); eq(sets().length, n, "Esc did not set anything");
    eq(el.querySelector(".apc-readout").textContent, "850 Hz", "previous value restored");
    eq(document.activeElement, el, "focus back on the control");
    inp = await openEntry(el); n = sets().length;
    inp.value = "banana"; H.key(inp, "Enter"); await H.tick();
    assert(!!el.querySelector(".apc-entry"), "entry stays open on invalid input");
    assert(inp.classList.contains("apc-invalid"), "red flash class");
    eq(inp.getAttribute("aria-invalid"), "true", "aria-invalid");
    eq(document.activeElement, inp, "focus kept on the entry"); eq(sets().length, n, "nothing sent");
    assert(/Not a number/.test((el.querySelector(".apc-hint") || {}).textContent || ""), "reason shown");
    inp.value = "99999"; H.key(inp, "Enter"); await H.tick();
    eq(lastSet(), 20000, "clamped to max");
    assert(/Clamped/.test((el.querySelector(".apc-hint") || {}).textContent || ""), "clamp hint shown");
  });

  test("selector entry accepts a label; toggle/selector keep value entry reachable via the context panel", async function () {
    var sel = await H.mk("selector", "wave");
    H.ctx(sel); await H.tick();
    var enter = APC.context.panel().querySelector('[data-k="enter"]'); enter.click(); await H.tick();
    var inp = sel.querySelector("input.apc-entry"); assert(!!inp, "entry for a selector without readout");
    inp.value = "tri"; H.key(inp, "Enter"); await H.tick();
    eq(lastSet(), "Triangle", "prefix match sends the label (not an index)");
  });

  /* ---------------- other kinds ---------------- */
  test("selector: shows label, menu lists labels, picking sends the label; arrows step", async function () {
    var el = await H.mk("selector", "wave", { "data-label": "WAVE" });
    eq(el.querySelector(".apc-flip-value").textContent, "Saw", "current label shown");
    H.click(el); await H.tick();
    var items = document.querySelectorAll(".apc-menu [role=option]");
    eq(items.length, 4, "4 options"); eq(items[2].textContent, "Square", "labels, not indices");
    items[2].click(); await H.tick();
    eq(lastSet(), "Square", "label sent over the bridge"); eq(el.getAttribute("aria-valuetext"), "Square", "valuetext");
    assert(!document.querySelector(".apc-menu"), "menu closed");
    H.key(el, "ArrowUp"); await H.tick(); eq(lastSet(), "Triangle", "arrow up -> next");
    H.key(el, "ArrowUp"); await H.tick(); eq(lastSet(), "Triangle", "clamped at the end");
    H.wheel(el, 100); await H.tick(); eq(lastSet(), "Square", "wheel steps once per notch");
    await sleep(300);
  });

  test("toggle: click/Space toggle with boolean values; Alt+click resets", async function () {
    var el = await H.mk("toggle", "bypass", { "data-label": "BYPASS" });
    eq(el.getAttribute("aria-checked"), "false", "initially off");
    H.click(el); await H.tick();
    eq(lastSet(), true, "boolean true sent"); eq(el.getAttribute("aria-checked"), "true", "aria-checked");
    H.key(el, " "); await H.tick(); eq(lastSet(), false, "Space toggles back");
    H.key(el, "Enter"); await H.tick(); eq(lastSet(), true, "Enter toggles");
    var n = M.calls.length; H.pe(el, "pointerdown", { alt: true }); H.click(el, { alt: true }); await H.tick();
    assert(H.callsSince(n).some(function (c) { return c.name === "apc.param.reset"; }), "alt+click resets");
    eq(el.getAttribute("aria-checked"), "false", "default off");
    eq(H.callsSince(n).filter(function (c) { return c.name === "apc.param.set"; }).length, 0, "alt+click did not toggle");
  });

  test("slider vertical/horizontal drag follows the track; track click jumps", async function () {
    var v = await H.mk("slider", "mix_pct", {}, { x: 2, y: 8, w: 4, h: 10 });
    var tr = v.querySelector(".apc-fader-track").getBoundingClientRect();
    H.drag(v, -tr.height * 0.25); await H.tick();
    near(val(v), 65, 0.01, "vertical: 25 % of the track length = +25");
    var hz = await H.mk("slider", "mix_pct", { "data-orientation": "h" }, { x: 12, y: 8, w: 10, h: 4 });
    var tw = hz.querySelector(".apc-fader-track").getBoundingClientRect();
    H.drag(hz, 0, {}, { dx: tw.width * 0.25 }); await H.tick();
    near(val(hz), 65, 0.01, "horizontal: 25 % of the track width = +25");
    var track = v.querySelector(".apc-fader-track"), r = track.getBoundingClientRect();
    H.pe(track, "pointerdown", { x: r.left + r.width / 2, y: r.top + r.height * 0.25 }); H.pe(track, "pointerup", { x: r.left + 1, y: r.top + r.height * 0.25 }); await H.tick();
    near(val(v), 75, 0.5, "click at 25 % from the top jumps to ~75");
  });

  test("live updates from param events; ignored while a drag is active", async function () {
    var el = await H.mk("knob", "cutoff_hz");
    M.emit("param", { id: "cutoff_hz", value: 2000 });
    eq(el.querySelector(".apc-readout").textContent, "2 kHz", "readout follows the host"); eq(el.getAttribute("aria-valuenow"), "2000", "aria follows");
    var g = await H.mk("knob", "gain_db");
    H.drag(g, -15, {}, { hold: true });
    var during = val(g);
    M.emit("param", { id: "gain_db", value: -20 });
    eq(val(g), during, "host echo ignored mid-drag");
    H.pe(g, "pointerup", {}); await H.tick();
    M.emit("param", { id: "gain_db", value: -20 }); eq(val(g), -20, "applied after the drag");
    M.find("gain_db").value = 3; M.emit("param", { id: "*", value: null }); await sleep(20);
    eq(val(g), 3, "wildcard param event re-reads descriptors");
  });

  test("modulation ring: ONE summed arc for all active routes, dot, live marker", async function () {
    var el = await H.mk("knob", "cutoff_hz", { "data-label": "CUTOFF" });
    var arcs = el.querySelectorAll(".apc-ring__route");
    eq(arcs.length, 1, "a single arc for the summed modulation (not one per route)");
    assert(arcs[0].classList.contains("apc-ring__sum"), "it is the summed arc");
    eq(arcs[0].getAttribute("data-src"), "sum", "summed arc marker");
    assert(!arcs[0].style.stroke, "no per-source colour (the sum is neutral, token-styled)");
    assert(!el.querySelector(".apc-mod-dot").hidden, "modulation dot visible");
    assert(/modulated by LFO 1/.test(el.getAttribute("aria-valuetext")), "aria-valuetext names the sources");
    var mk = el.querySelector(".apc-ring__marker");
    eq(mk.getAttribute("visibility"), "hidden", "no live position yet");
    M.emit("param", { id: "cutoff_hz", value: 850, modulated: 1500 });
    eq(mk.getAttribute("visibility"), "visible", "live marker after a modulated value");
    var plain = await H.mk("knob", "plain");
    eq(plain.querySelectorAll(".apc-ring__route").length, 0, "no arcs without routes");
    assert(plain.querySelector(".apc-mod-dot").hidden, "dot hidden without routes");
    var p0 = APC.controls.sourceStyle("LFO 1"), p1 = APC.controls.sourceStyle("lfo1"), p2 = APC.controls.sourceStyle("Env 1");
    eq(p0.n, p1.n, "source naming is normalised"); assert(p0.n !== p2.n || p0.dash !== p2.dash, "distinct sources differ in colour or dash");
  });

  test("modulation sum: reach adds up over active routes, bypassed routes do not count; slider shows one band", async function () {
    var el = await H.mk("knob", "cutoff_hz");
    var one = el.querySelector(".apc-ring__sum").getAttribute("d");
    H.ctx(el);
    var p = APC.context.panel();
    p.querySelector('[data-k="byp1"]').click(); await sleep(30);
    var bypassed = el.querySelector(".apc-ring__sum").getAttribute("d");
    assert(bypassed !== one, "bypassing a route changes the summed arc");
    eq(el.querySelectorAll(".apc-ring__route").length, 1, "still exactly one arc");
    var sl = await H.mk("slider", "mix_pct");
    assert(sl.querySelectorAll(".apc-fader-route").length <= 1, "slider never shows more than one modulation band");
    APC.context.close && APC.context.close(false);
  });

  test("no visible ⋯ options button by default on any control; data-more=show opts in; the panel stays reachable", async function () {
    var k = await H.mk("knob", "gain_db"), s = await H.mk("slider", "mix_pct"), t = await H.mk("toggle", "bypass"), c = await H.mk("selector", "wave");
    [k, s, t, c].forEach(function (n) { assert(!n.querySelector(".apc-ctl-more"), n.className + " has no ⋯"); });
    var t2 = await H.mk("toggle", "bypass", { "data-more": "show" });
    assert(!!t2.querySelector(".apc-ctl-more"), "data-more=show adds it");
    t.focus(); H.key(t, "ContextMenu"); assert(APC.context.isOpen(), "toggle opens the options via the keyboard"); H.key(document.body, "Escape");
    H.ctx(k); assert(APC.context.isOpen(), "right-click opens the options"); H.key(document.body, "Escape");
  });

  test("gain-like (dB) knobs fill from the minimum like a normal knob; only zero-centred non-dB ranges fill from the middle", async function () {
    function start(el) { var d = el.querySelector(".apc-ring__value").getAttribute("d") || ""; return (d.match(/^M\s*([-\d.]+)[ ,]([-\d.]+)/) || [])[0]; }
    var g = await H.mk("knob", "gain_db"), forcedMin = await H.mk("knob", "gain_db", { "data-bipolar": "false" }), forcedBi = await H.mk("knob", "gain_db", { "data-bipolar": "true" });
    assert(!!start(g), "gain arc has geometry");
    eq(start(g), start(forcedMin), "dB gain arc starts at the minimum (same as data-bipolar=false)");
    assert(start(g) !== start(forcedBi), "...and not at zero (data-bipolar=true starts elsewhere)");
  });

  /* ---------------- context panel ---------------- */
  function secs() { return Array.prototype.map.call(APC.context.panel().querySelectorAll("[data-sec]"), function (s) { return s.getAttribute("data-sec"); }); }
  test("right-click opens the context panel (never the browser menu): VALUE, MODULATION, MIDI, HELP; Esc closes and refocuses", async function () {
    var el = await H.mk("knob", "cutoff_hz", { "data-label": "CUTOFF" });
    var ev = H.ctx(el);
    assert(ev.defaultPrevented, "contextmenu default prevented"); assert(APC.context.isOpen(), "panel open");

    var ev = H.wheel(el, -100); assert(!ev.defaultPrevented, "wheel ignored after dispose");
    H.drag(el, -30); H.key(el, "ArrowUp"); await H.tick();
    eq(M.names().slice(n).filter(function (x) { return x.indexOf("apc.param.") === 0; }).length, 0, "no bridge traffic after dispose");
    var bare = document.createElement("div"); bare.setAttribute("data-apc", "knob"); H.plate().appendChild(bare); APC.mount(H.plate()); await H.tick();
    assert(!!document.querySelector(".apc-toast--error"), "missing data-param is reported visibly");
  });

  test("accessibility: every mounted control is focusable + named; kit CSS has focus-visible and reduced-motion handling", async function () {
    var ids = [["knob", "cutoff_hz"], ["slider", "mix_pct"], ["selector", "wave"], ["toggle", "bypass"]];
    for (var i = 0; i < ids.length; i++) {
      var e = await H.mk(ids[i][0], ids[i][1]);
      assert(e.tabIndex === 0, ids[i][0] + " is in the tab order");
      assert(!!e.getAttribute("role") && !!e.getAttribute("aria-label"), ids[i][0] + " has role + name");
      e.focus(); eq(document.activeElement, e, ids[i][0] + " takes focus");
    }
    var btns = document.querySelectorAll("#plate button");
    Array.prototype.forEach.call(btns, function (b) { assert((b.getAttribute("aria-label") || b.textContent || "").trim().length > 0, "button has a name: " + b.className); });
  });

  window.addEventListener("error", function (e) { H.assert(false, "uncaught error: " + e.message); });
  H.run();
})();
</script>
