<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kit-widgets</title>
<!-- Self-test for apc-widgets.js / apc-widgets.css (button, buttons/segmented, checkbox, radio, dropdown, menu,
     tabs, textfield, numberfield, label, readout, panel, divider, led, progress, list, logo) and for the flat re-skin
     options of the knob / slider / selector / toggle. Uses apc-mock.js as the bridge (param round trips) and
     harness-b.js. Result: window.__APC_TEST__ and <pre id="apc-test-result"> (CONTRACT.md "Testing contract"). -->
<link rel="stylesheet" href="../apc-core.css">
<link rel="stylesheet" href="../apc-components.css">
<link rel="stylesheet" href="../apc-widgets.css">
<style>.apc-w, .apc-w *, .apc-pop, .apc-pop * { transition: none !important; }  /* headless virtual time produces no frames: measure final styles */
:root { --cols: 50; --rows: 27.5; } #stage { padding: .5rem; } #stage > * { margin-bottom: .5rem; }</style>
</head>
<body>
<div id="stage" class="apc-plate"></div>
<script src="../apc-fit.js"></script>
<script src="../apc-kit.js"></script>
<script src="../apc-mock.js"></script>
<script src="../apc-controls.js"></script>
<script src="../apc-context.js"></script>
<script src="../apc-widgets.js"></script>
<script src="harness-b.js"></script>
<script>
(function () {
  "use strict";
  var APC = window.APC, T = window.T, test = T.test, assert = T.assert, eq = T.eq, $ = T.q, $$ = T.qa;

  /* ---------------- helpers ---------------- */
  function rem() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }
  function pe(el, type, o) {
    o = o || {};
    var r = el.getBoundingClientRect();
    var ev = new PointerEvent(type, { bubbles: true, cancelable: true, pointerId: o.id || 1, pointerType: o.type || "mouse",
      clientX: o.x !== undefined ? o.x : r.left + r.width / 2, clientY: o.y !== undefined ? o.y : r.top + r.height / 2, button: 0, buttons: 1 });
    el.dispatchEvent(ev);
    return ev;
  }
  function kd(el, key, o) {
    o = o || {};
    var ev = new KeyboardEvent("keydown", { key: key, bubbles: true, cancelable: true, shiftKey: !!o.shift, ctrlKey: !!o.ctrl, metaKey: !!o.meta, altKey: !!o.alt, repeat: !!o.repeat });
    el.dispatchEvent(ev);
    return ev;
  }
  function ku(el, key) { el.dispatchEvent(new KeyboardEvent("keyup", { key: key, bubbles: true, cancelable: true })); }
  function start(html, scenario) {
    APC.widgets.closeAll();
    APC.controls.closeMenu(false);
    document.documentElement.removeAttribute("data-theme");
    T.reset(scenario);
    $("#stage").style.cssText = "";
    T.mount(html);
    return T.settle();
  }
  function pcalls() { return APC.mock.calls().filter(function (c) { return /^apc\.param\.(begin|set|end|reset)$/.test(c.name); }); }
  function names() { return pcalls().map(function (c) { return c.name.replace("apc.param.", ""); }); }
  function sets() { return APC.mock.calls("apc.param.set"); }
  function lastSet() { var s = sets(); return s.length ? s[s.length - 1].args.value : undefined; }
  function listen(el, type) { var got = []; el.addEventListener(type, function (e) { got.push(e.detail); }); return got; }
  function pops() { return $$(".apc-pop"); }
  function accName(el) {
    var lb = el.getAttribute("aria-labelledby");
    if (lb) { var t = lb.split(/\s+/).map(function (id) { var n = document.getElementById(id); return n ? n.textContent : ""; }).join(" ").trim(); if (t) return t; }   /* aria-labelledby wins over aria-label */
    var a = el.getAttribute("aria-label");
    if (a) return a;
    if (el.labels && el.labels.length) return el.labels[0].textContent;
    return (el.textContent || "").trim() || el.getAttribute("title") || el.getAttribute("placeholder") || "";
  }
  function tokenColor(name) {
    var probe = document.createElement("span"); probe.style.cssText = "background-color: var(--" + name + ")"; $("#stage").appendChild(probe);
    var c = getComputedStyle(probe).backgroundColor; probe.parentNode.removeChild(probe); return c;
  }
  function inBounds(r, b, tol) { tol = tol || 1; return r.left >= b.left - tol && r.right <= b.right + tol && r.top >= b.top - tol && r.bottom <= b.bottom + tol; }

  /* ================================================================================
     structure: every element mounts, registers, and is catalogued
     ================================================================================ */
  test("all 18 widget names (+ segmented alias) are registered; elements get class, unique id and a handle", function () {
    var names = ["button", "buttons", "segmented", "checkbox", "radio", "dropdown", "menu", "tabs", "textfield", "numberfield", "label", "readout", "panel", "divider", "led", "progress", "list", "logo"];
    var have = APC.components();
    names.forEach(function (n) { assert(have.indexOf(n) >= 0, "registered: " + n); });
    return start(names.map(function (n) { return '<div data-apc="' + n + '" data-label="X" data-items=\'["a","b"]\' data-title="T"><section data-tab="One">x</section></div>'; }).join("")).then(function () {
      var hosts = $$("#stage > .apc-w");
      eq(hosts.length, names.length, "every host decorated with .apc-w");
      var ids = hosts.map(function (h) { return h.id; });
      eq(ids.filter(function (id, i) { return id && ids.indexOf(id) === i; }).length, names.length, "ids unique and non-empty");
      hosts.forEach(function (h) { assert(h.__apcW && typeof h.__apcW.dispose === "function" && APC.widgets.get(h) === h.__apcW, "handle on " + h.className); });
    });
  });

  /* ================================================================================
     button
     ================================================================================ */
  test("button action: click emits apc:click + bus event; label, icon and LED slots; native <button>", function () {
    return start('<div id="b1" data-apc="button" data-label="Reset" data-icon="▶" data-led="true" data-action="reset" data-title="Reset it"></div>').then(function () {
      var el = $("#b1"), btn = $("button.apc-button", el), got = listen(el, "apc:click"), bus = [];
      var off = APC.on("button", function (d) { bus.push(d); });
      eq(btn.tagName, "BUTTON"); eq(btn.type, "button");
      eq($(".apc-button__label", btn).textContent, "Reset"); eq($(".apc-button__icon", btn).textContent, "▶");
      assert($(".apc-led", btn), "LED slot"); eq(btn.getAttribute("title"), "Reset it");
      btn.click();
      eq(got.length, 1, "apc:click"); eq(bus.length, 1, "bus event"); eq(bus[0].action, "reset"); eq(bus[0].variant, "action");
      off();
      assert(!btn.hasAttribute("aria-pressed"), "action button is not a toggle");
      assert(btn.classList.contains("apc-button--action"), "variant class");
    });
  });

  test("button primary + inline SVG icon slot + icon-only accessible name", function () {
    return start('<div id="b1" data-apc="button" data-variant="primary" data-label="Save"></div>' +
      '<div id="b2" data-apc="button" data-aria-label="Play"><svg data-slot="icon" viewBox="0 0 8 8"><path d="M1 1 L7 4 L1 7 Z"/></svg></div>').then(function () {
      assert($("#b1 .apc-button--primary"), "primary class");
      var b2 = $("#b2 button");
      assert(b2.querySelector("svg"), "svg moved into the icon slot"); eq(b2.getAttribute("aria-label"), "Play", "icon-only has a name");
      eq(accName(b2), "Play");
    });
  });

  test("button latch: toggles aria-pressed, emits change, LED follows, initial data-pressed, setPressed", function () {
    return start('<div id="b1" data-apc="button" data-variant="latch" data-label="Mute" data-led="true"></div><div id="b2" data-apc="button" data-variant="latch" data-label="Solo" data-pressed="true"></div>').then(function () {
      var el = $("#b1"), btn = $("button", el), got = listen(el, "apc:change");
      eq(btn.getAttribute("aria-pressed"), "false"); eq($(".apc-led", btn).getAttribute("data-state"), "off");
      btn.click();
      eq(btn.getAttribute("aria-pressed"), "true"); eq($(".apc-led", btn).getAttribute("data-state"), "on"); assert(btn.classList.contains("is-on"));
      eq(got.length, 1); eq(got[0].pressed, true);
      btn.click(); eq(btn.getAttribute("aria-pressed"), "false");
      eq($("#b2 button").getAttribute("aria-pressed"), "true", "data-pressed");
      el.__apcW.setPressed(true); eq(btn.getAttribute("aria-pressed"), "true"); eq(el.__apcW.getPressed(), true);
    });
  });

  test("button disabled: native disabled, ignores clicks, re-enable works, aria-disabled on the host", function () {
    return start('<div id="b1" data-apc="button" data-label="Go" data-disabled="true"></div>').then(function () {
      var el = $("#b1"), btn = $("button", el), n = 0;
      el.addEventListener("apc:click", function () { n++; });
      assert(btn.disabled, "native disabled"); eq(el.getAttribute("aria-disabled"), "true");
      btn.click(); eq(n, 0, "no event while disabled");
      el.__apcW.setDisabled(false); assert(!btn.disabled); btn.click(); eq(n, 1);
    });
  });

  test("button momentary param: pointer press writes the max value (one gesture), release the min; click-only pulses; keyboard press/release", function () {
    return start('<div id="b1" data-apc="button" data-label="Panic" data-param="bypass"></div>').then(function () {
      var btn = $("#b1 button");
      pe(btn, "pointerdown"); return T.settle().then(function () {
        eq(names(), ["begin", "set"], "begin + set on press"); eq(lastSet(), "On");
        pe(btn, "pointerup"); return T.settle();
      }).then(function () {
        eq(names(), ["begin", "set", "set", "end"], "release sets the min value and ends the gesture"); eq(lastSet(), "Off");
        APC.mock.clearCalls(); pe(btn, "pointerdown"); pe(btn, "pointerup"); btn.click(); return T.settle();
      }).then(function () {
        eq(names(), ["begin", "set", "set", "end"], "the click that ends a pointer gesture does not pulse a second time");
        APC.mock.clearCalls(); btn.click(); return T.settle();
      }).then(function () {
        eq(names(), ["begin", "set", "set", "end"], "programmatic click = one complete pulse");
        APC.mock.clearCalls(); pe(btn, "pointerdown", { type: "touch" }); pe(btn, "pointercancel", { type: "touch" }); return T.settle();
      }).then(function () {
        eq(names(), ["begin", "set", "set", "end"], "touch press + cancel releases");
        APC.mock.clearCalls(); var ev = kd(btn, "Enter"); assert(ev.defaultPrevented); kd(btn, "Enter", { repeat: true }); ku(btn, "Enter"); return T.settle();
      }).then(function () { eq(names(), ["begin", "set", "set", "end"], "keyboard Enter press/release, repeat ignored"); });
    });
  });

  test("button latch param: click writes the choice labels, follows host param events, error state for an unknown param", function () {
    return start('<div id="b1" data-apc="button" data-variant="latch" data-label="Bypass" data-param="bypass"></div><div id="b2" data-apc="button" data-label="X" data-param="nope"></div>').then(function () {
      var btn = $("#b1 button");
      eq(btn.getAttribute("aria-pressed"), "false"); btn.click(); return T.settle().then(function () {
        eq(lastSet(), "On"); eq(btn.getAttribute("aria-pressed"), "true"); eq(names(), ["begin", "set", "end"]);
        APC.mock.emit("param", { id: "bypass", value: "Off" }); return T.settle();
      }).then(function () {
        eq(btn.getAttribute("aria-pressed"), "false", "host change reflected");
        var b2 = $("#b2");
        eq(b2.getAttribute("aria-invalid"), "true", "error state"); assert(b2.classList.contains("is-error")); assert($("#b2 button").disabled, "unusable");
        assert(T.toasts("error").length >= 1, "the failure is shown, never silent");
      });
    });
  });

  /* ================================================================================
     buttons / segmented / radio
     ================================================================================ */
  test("buttons (static options): radiogroup, aria-checked, roving tabindex, click selects, change event", function () {
    return start('<div id="g1" data-apc="buttons" data-label="MODE" data-value="b"><option value="a">A</option><option value="b">B</option><option value="c" disabled>C</option><option value="d">D</option></div>').then(function () {
      var el = $("#g1"), grp = $("[role=radiogroup]", el), items = $$("[role=radio]", grp), got = listen(el, "apc:change");
      eq(items.length, 4); eq(grp.getAttribute("aria-labelledby"), $(".apc-w__label", el).id); eq(accName(grp), "MODE"); eq(grp.getAttribute("aria-orientation"), "horizontal");
      eq(items.map(function (i) { return i.getAttribute("aria-checked"); }), ["false", "true", "false", "false"], "data-value picks B");
      eq(items.map(function (i) { return i.getAttribute("tabindex"); }), ["-1", "0", "-1", "-1"], "roving tabindex");
      eq(items[2].getAttribute("aria-disabled"), "true");
      items[3].click();
      eq(items[3].getAttribute("aria-checked"), "true"); eq(items[1].getAttribute("aria-checked"), "false"); eq(got.length, 1); eq(got[0].value, "d"); eq(got[0].index, 3);
      items[2].click(); eq(items[2].getAttribute("aria-checked"), "false", "disabled item cannot be chosen");
      eq(el.__apcW.getValue(), "d");
    });
  });

  test("buttons keyboard: arrows move+select (wrap, skip disabled), Home/End, Space selects focused", function () {
    return start('<div id="g1" data-apc="segmented" data-items=\'[{"value":"a","label":"A"},{"value":"b","label":"B"},{"value":"c","label":"C","disabled":true},{"value":"d","label":"D"}]\'></div>').then(function () {
      var el = $("#g1"), items = $$("[role=radio]", el);
      function sel() { return items.map(function (i) { return i.getAttribute("aria-checked") === "true" ? 1 : 0; }).join(""); }
      eq(sel(), "1000");
      var ev = kd(items[0], "ArrowRight"); assert(ev.defaultPrevented); eq(sel(), "0100"); eq(document.activeElement, items[1]);
      kd(items[1], "ArrowDown"); eq(sel(), "0001", "skips the disabled C");
      kd(items[3], "ArrowRight"); eq(sel(), "1000", "wraps");
      kd(items[0], "ArrowLeft"); eq(sel(), "0001", "wraps backwards");
      kd(items[3], "Home"); eq(sel(), "1000"); kd(items[0], "End"); eq(sel(), "0001");
      kd(items[1], " "); eq(sel(), "0100", "Space selects the focused item");
    });
  });

  test("buttons param-bound: items = descriptor choices, click writes the label, host events update, vertical orientation", function () {
    return start('<div id="g1" data-apc="buttons" data-param="osc_wave" data-label="WAVE" data-orient="vertical"></div>').then(function () {
      var el = $("#g1"), items = $$("[role=radio]", el);
      eq(items.map(function (i) { return i.textContent; }), ["Sine", "Saw", "Square", "Triangle"]);
      eq(items.map(function (i) { return i.getAttribute("aria-checked"); }), ["false", "true", "false", "false"]);
      eq(el.getAttribute("data-orient"), "vertical"); eq($("[role=radiogroup]", el).getAttribute("aria-orientation"), "vertical");
      eq(getComputedStyle($("[role=radiogroup]", el)).flexDirection, "column");
      items[2].click(); return T.settle().then(function () {
        eq(lastSet(), "Square"); eq(names(), ["begin", "set", "end"]); eq(items[2].getAttribute("aria-checked"), "true");
        APC.mock.emit("param", { id: "osc_wave", value: "Sine" }); return T.settle();
      }).then(function () { eq(items[0].getAttribute("aria-checked"), "true", "follows the host"); eq(items[2].getAttribute("aria-checked"), "false"); });
    });
  });

  test("buttons on a numeric parameter with data-items (values are the parameter's numbers)", function () {
    return start('<div id="g1" data-apc="buttons" data-param="detune_ct" data-items=\'[{"value":-50,"label":"Down"},{"value":0,"label":"Zero"},{"value":50,"label":"Up"}]\'></div>').then(function () {
      var items = $$("[role=radio]", $("#g1"));
      eq(items.map(function (i) { return i.getAttribute("aria-checked"); }), ["false", "true", "false"], "default 0 selected");
      items[2].click(); return T.settle().then(function () { eq(lastSet(), 50); });
    });
  });

  test("radio group: indicator + label, arrows, options parsed, horizontal option", function () {
    return start('<div id="r1" data-apc="radio" data-label="QUALITY" data-orient="horizontal"><option>Draft</option><option>Good</option><option selected>Best</option></div>').then(function () {
      var el = $("#r1"), items = $$("[role=radio]", el);
      eq(items.length, 3); assert($(".apc-radio__box", items[0]) && $(".apc-radio__dot", items[0]));
      eq(items[2].getAttribute("aria-checked"), "true"); eq(getComputedStyle($(".apc-group", el)).flexDirection, "row");
      kd(items[2], "ArrowLeft"); eq(items[1].getAttribute("aria-checked"), "true"); eq(document.activeElement, items[1]);
      assert(getComputedStyle($(".apc-radio__dot", items[1])).display !== "none", "dot visible when selected");
      assert(getComputedStyle($(".apc-radio__dot", items[0])).display === "none", "dot hidden otherwise");
    });
  });

  /* ================================================================================
     checkbox
     ================================================================================ */
  test("checkbox: role/aria-checked, click + Space toggle, label, change event, indeterminate", function () {
    return start('<div id="c1" data-apc="checkbox" data-label="Snap to grid"></div><div id="c2" data-apc="checkbox" data-label="Some" data-indeterminate="true"></div><div id="c3" data-apc="checkbox" data-label="On" data-checked="true"></div>').then(function () {
      var el = $("#c1"), cb = $("[role=checkbox]", el), got = listen(el, "apc:change");
      eq(cb.getAttribute("aria-checked"), "false"); eq(cb.getAttribute("tabindex"), "0"); eq(accName(cb), "Snap to grid");
      cb.click(); eq(cb.getAttribute("aria-checked"), "true"); eq(got[0].checked, true);
      var ev = kd(cb, " "); assert(ev.defaultPrevented); eq(cb.getAttribute("aria-checked"), "false"); eq(got.length, 2);
      eq($("#c2 [role=checkbox]").getAttribute("aria-checked"), "mixed"); $("#c2 [role=checkbox]").click(); eq($("#c2 [role=checkbox]").getAttribute("aria-checked"), "true");
      eq($("#c3 [role=checkbox]").getAttribute("aria-checked"), "true", "data-checked");
      assert(getComputedStyle($(".apc-check__tick", $("#c3"))).display !== "none", "tick visible when checked");
    });
  });

  test("checkbox param-bound (boolean-like choice) and disabled", function () {
    return start('<div id="c1" data-apc="checkbox" data-label="Bypass" data-param="bypass"></div><div id="c2" data-apc="checkbox" data-label="Off" data-disabled="true"></div>').then(function () {
      var cb = $("#c1 [role=checkbox]");
      eq(cb.getAttribute("aria-checked"), "false"); cb.click(); return T.settle().then(function () {
        eq(lastSet(), "On"); eq(cb.getAttribute("aria-checked"), "true");
        APC.mock.emit("param", { id: "bypass", value: "Off" }); return T.settle();
      }).then(function () {
        eq(cb.getAttribute("aria-checked"), "false", "host update");
        var d = $("#c2 [role=checkbox]"); eq(d.getAttribute("tabindex"), "-1"); eq(d.getAttribute("aria-disabled"), "true"); d.click(); eq(d.getAttribute("aria-checked"), "false", "disabled ignores clicks");
      });
    });
  });

  /* ================================================================================
     dropdown
     ================================================================================ */
  var DD = '<div id="d1" data-apc="dropdown" data-label="WAVE"><option value="s">Sine</option><option value="w">Saw</option><option value="q">Square</option><option value="t" disabled>Tri</option></div>';
  test("dropdown: closed field shows the value; click opens a listbox popup; choosing closes + emits; aria", function () {
    return start(DD).then(function () {
      var el = $("#d1"), trig = $("[role=combobox]", el), got = listen(el, "apc:change");
      eq($(".apc-dd__value", el).textContent, "Sine"); eq(trig.getAttribute("aria-expanded"), "false"); eq(trig.getAttribute("aria-haspopup"), "listbox"); eq(accName(trig).indexOf("WAVE"), 0);
      trig.click();
      eq(pops().length, 1, "popup in the DOM"); var lb = $(".apc-pop [role=listbox]"); assert(lb, "listbox");
      eq(trig.getAttribute("aria-expanded"), "true"); eq(trig.getAttribute("aria-controls"), lb.id);
      var opts = $$("[role=option]", lb); eq(opts.length, 4); eq(opts[0].getAttribute("aria-selected"), "true");
      eq(trig.getAttribute("aria-activedescendant"), opts[0].id);
      opts[3].click(); eq(pops().length, 1, "disabled option does nothing");
      opts[2].click();
      eq(pops().length, 0, "closed after choosing"); eq($(".apc-dd__value", el).textContent, "Square"); eq(got[0].value, "q"); eq(got[0].label, "Square"); eq(trig.getAttribute("aria-expanded"), "false");
      eq(el.__apcW.getValue(), "q");
    });
  });

  test("dropdown keyboard: open (Down/Enter/Space), arrows skip disabled, Home/End, Enter chooses, Esc closes + refocuses, Tab closes, type-ahead", function () {
    return start(DD).then(function () {
      var el = $("#d1"), trig = $("[role=combobox]", el);
      trig.focus();
      var ev = kd(trig, "ArrowDown"); assert(ev.defaultPrevented); eq(pops().length, 1);
      function active() { var a = $(".apc-pop .is-active"); return a ? a.textContent : null; }
      eq(active(), "Sine");
      kd(trig, "ArrowDown"); eq(active(), "Saw"); kd(trig, "ArrowDown"); eq(active(), "Square"); kd(trig, "ArrowDown"); eq(active(), "Square", "disabled Tri skipped, clamps at the end");
      kd(trig, "Home"); eq(active(), "Sine"); kd(trig, "End"); eq(active(), "Square");
      kd(trig, "Escape"); eq(pops().length, 0, "Esc closes"); eq(document.activeElement, trig, "focus returns to the field"); eq($(".apc-dd__value", el).textContent, "Sine", "Esc does not choose");
      kd(trig, "Enter"); kd(trig, "ArrowDown"); kd(trig, "Enter"); eq(pops().length, 0); eq($(".apc-dd__value", el).textContent, "Saw", "Enter chooses the active option");
      kd(trig, " "); eq(pops().length, 1, "Space opens"); kd(trig, "Tab"); eq(pops().length, 0, "Tab closes without choosing"); eq($(".apc-dd__value", el).textContent, "Saw");
      kd(trig, "s"); eq(pops().length, 1, "typing opens"); eq(active(), "Square", "type-ahead jumps to the match"); kd(trig, "Enter"); eq($(".apc-dd__value", el).textContent, "Square");
    });
  });

  test("dropdown: outside click closes, second click on the field closes, disabled does not open, dispose closes the popup", function () {
    return start(DD + '<div id="d2" data-apc="dropdown" data-disabled="true"><option>A</option></div>').then(function () {
      var el = $("#d1"), trig = $("[role=combobox]", el);
      trig.click(); eq(pops().length, 1); pe(document.body, "pointerdown"); eq(pops().length, 0, "outside pointerdown closes");
      trig.click(); trig.click(); eq(pops().length, 0, "toggle");
      var d2 = $("#d2 [role=combobox]"); eq(d2.getAttribute("aria-disabled"), "true"); d2.click(); eq(pops().length, 0);
      trig.click(); eq(pops().length, 1); el.__apcW.dispose(); eq(pops().length, 0, "dispose closes the popup");
    });
  });

  test("dropdown param-bound (choices from the descriptor): chooses by label, follows host, searchable filter", function () {
    return start('<div id="d1" data-apc="dropdown" data-param="osc_wave" data-label="WAVE" data-searchable="true"></div>').then(function () {
      var el = $("#d1"), trig = $("[role=combobox]", el);
      eq($(".apc-dd__value", el).textContent, "Saw"); trig.click();
      var search = $(".apc-pop input[role=searchbox]"); assert(search, "filter field"); eq(document.activeElement, search, "focus in the filter");
      search.value = "sq"; search.dispatchEvent(new Event("input", { bubbles: true }));
      eq($$(".apc-pop [role=option]").map(function (o) { return o.textContent; }), ["Square"], "filtered");
      eq(search.getAttribute("aria-activedescendant"), $(".apc-pop [role=option]").id);
      kd(search, "Enter"); return T.settle().then(function () {
        eq(lastSet(), "Square"); eq(names(), ["begin", "set", "end"]); eq($(".apc-dd__value", el).textContent, "Square"); eq(pops().length, 0);
        APC.mock.emit("param", { id: "osc_wave", value: "Triangle" }); return T.settle();
      }).then(function () {
        eq($(".apc-dd__value", el).textContent, "Triangle", "follows the host"); trig.click();
        search = $(".apc-pop input[role=searchbox]"); search.value = "zzz"; search.dispatchEvent(new Event("input", { bubbles: true }));

    return start('<div id="k1" data-apc="knob" data-param="cutoff_hz" data-label="CUT" data-size="lg" data-ticks="5"></div><div id="k2" data-apc="knob" data-param="detune_ct" data-label="DET" data-unit="separate" data-readout="above"></div>' +
      '<div id="k3" data-apc="knob" data-param="gain_db" data-label="GAIN" data-unit="none" data-size="sm"></div><div id="k4" data-apc="knob" data-param="mix_pct" data-label="OFF" data-readout="none" data-disabled="true"></div><div id="k5" data-apc="knob" data-param="mix_pct" data-bipolar="true" data-label="BI"></div>').then(function () {
      var r = rem(), w1 = $("#k1 .apc-knob-wrap").getBoundingClientRect();
      assert(Math.abs(w1.width - 4 * r) < 1.5, "lg knob = 4rem: " + w1.width + " vs " + 4 * r); assert(Math.abs($("#k3 .apc-knob-wrap").getBoundingClientRect().width - 2 * r) < 1.5, "sm knob = 2rem");
      eq($$("#k1 .apc-ring__tick").length, 5, "5 ticks"); eq($$("#k2 .apc-ring__tick").length, 0);
      var val = getComputedStyle($("#k1 .apc-ring__value"));
      eq(val.fill, "none"); eq(val.stroke, tokenColor("accent"), "value arc is the accent colour"); eq($$("#k1 .apc-ring__track").length, 0, "no thin track ring");
      eq(getComputedStyle($("#k1 .apc-knob-dial")).backgroundImage, "none", "no radial gradient"); eq(getComputedStyle($("#k1 .apc-knob-dial")).boxShadow, "none");
      eq(getComputedStyle($("#k1 .apc-knob-pointer")).width, "2px", "pointer line");
      eq($("#k1 .apc-readout").textContent, "1.2 kHz", "default unit mode unchanged");
      eq($("#k2 .apc-readout").textContent, "0 ct", "separate keeps the same text"); eq($("#k2 .apc-readout__u").textContent, "ct"); eq($("#k2 .apc-readout__v").textContent, "0");
      eq($("#k3 .apc-readout").textContent, "0", "unit none"); eq($("#k3").getAttribute("aria-valuetext"), "0 dB", "...but the accessible value keeps the unit");
      var k2 = $("#k2"), ro = $("#k2 .apc-readout"); assert(ro.getBoundingClientRect().top < $("#k2 .apc-knob-wrap").getBoundingClientRect().top, "readout above the dial");
      assert(!$("#k4 .apc-readout"), "readout none"); eq($("#k4").getAttribute("aria-disabled"), "true"); eq($("#k4").getAttribute("tabindex"), "-1");
      var n = APC.mock.calls("apc.param.set").length; kd($("#k4"), "ArrowUp"); pe($("#k4"), "pointerdown"); pe($("#k4"), "pointermove", { y: 0 }); pe($("#k4"), "pointerup"); return T.settle().then(function () {
        eq(APC.mock.calls("apc.param.set").length, n, "disabled knob ignores keys and drags");
        $("#k4").__apcCtl.setDisabled(false); eq($("#k4").getAttribute("tabindex"), "0"); kd($("#k4"), "ArrowDown"); return T.settle();
      }).then(function () {
        assert(APC.mock.calls("apc.param.set").length > n, "works again once enabled");
        assert($("#k5 .apc-ring__value").getAttribute("d") !== null);
      });
    });
  });

  test("knob keeps its behaviour: wheel / keys / drag still write values after the re-skin", function () {
    return start('<div class="apc-cell" style="position:absolute;left:2rem;top:2rem;width:6rem;height:8rem" id="k1" data-apc="knob" data-param="gain_db" data-label="G"></div>').then(function () {
      var k = $("#k1"); kd(k, "End"); return T.settle().then(function () {
        eq(lastSet(), 12); eq(k.getAttribute("aria-valuenow"), "12"); kd(k, "Delete"); return T.settle();
      }).then(function () { eq(k.getAttribute("aria-valuenow"), "0"); eq(getComputedStyle(k).touchAction, "none"); });
    });
  });

  test("slider (flat): vertical + horizontal via data-orient, bipolar fill from centre, ticks, data-size, flat thumb", function () {
    return start('<div id="s1" data-apc="slider" data-param="gain_db" data-label="V" data-ticks="3" data-size="sm"></div><div id="s2" data-apc="slider" data-orient="horizontal" data-param="mix_pct" data-label="H" data-ticks="4"></div><div id="s4" data-apc="slider" data-param="osc_wave" data-label="W" data-ticks="steps"></div><div id="s3" data-apc="slider" data-param="detune_ct" data-orient="h" data-label="BI"></div>').then(function () {
      var r = rem();
      assert($("#s2").classList.contains("apc-fader--h") && $("#s3").classList.contains("apc-fader--h"), "data-orient=horizontal|h");
      var t1 = $("#s1 .apc-fader-track").getBoundingClientRect(); assert(Math.abs(t1.height - 4 * r) < 1.5, "sm slider track = 4rem: " + t1.height); assert(t1.height > t1.width);
      var t2 = $("#s2 .apc-fader-track").getBoundingClientRect(); assert(t2.width > t2.height * 4, "horizontal track is wide");
      eq($$("#s1 .apc-fader-tick").length, 3); eq($$("#s2 .apc-fader-tick").length, 4); eq($$("#s4 .apc-fader-tick").length, 4, "ticks=steps: one per choice");
      var fill = $("#s3 .apc-fader-fill"); eq(parseFloat(fill.style.width) || 0, 0, "detune = 0 sits at the centre: no fill"); eq(fill.style.left, "50%", "bipolar fill starts at the centre");
      var cap = getComputedStyle($("#s1 .apc-fader-cap")); eq(cap.boxShadow, "none"); eq(cap.backgroundImage, "none"); eq(cap.borderTopWidth, "1px");
      kd($("#s3"), "ArrowRight"); return T.settle().then(function () { assert(parseFloat($("#s3 .apc-fader-fill").style.width) > 0, "fill grows to the right of the centre"); });
    });
  });

  test("selector (stepper): prev / value / next buttons step through the choices, clamp at the ends, label + menu still work, steppers=false", function () {
    return start('<div id="e1" data-apc="selector" data-param="osc_wave" data-label="WAVE"></div><div id="e2" data-apc="selector" data-param="osc_wave" data-steppers="false" data-label="W2"></div>').then(function () {
      var e = $("#e1"), prev = $(".apc-sel-step--prev", e), next = $(".apc-sel-step--next", e);
      assert(prev && next, "stepper buttons"); eq(prev.getAttribute("aria-label"), "Previous WAVE"); eq($(".apc-flip-value", e).textContent, "Saw");
      next.click(); return T.settle().then(function () {
        eq(lastSet(), "Square"); next.click(); return T.settle();
      }).then(function () {
        eq(lastSet(), "Triangle"); assert(next.disabled, "next disabled at the last choice"); prev.click(); return T.settle();
      }).then(function () {
        eq(lastSet(), "Square"); eq($(".apc-flip-value", e).textContent, "Square"); eq(getComputedStyle(prev).borderTopWidth, "1px");
        assert(!$(".apc-sel-step", $("#e2")), "steppers can be turned off"); $(".apc-flip-cap", e).click(); eq($$(".apc-menu [role=option]").length, 4, "menu still opens from the value field");
        APC.controls.closeMenu(false);
      });
    });
  });

  test("toggle (flat switch): track + thumb, aria-checked, click/Space, data-variant=button, disabled", function () {
    return start('<div id="t1" data-apc="toggle" data-param="bypass" data-label="BYPASS"></div><div id="t2" data-apc="toggle" data-param="bypass" data-label="B2" data-variant="button"></div><div id="t3" data-apc="toggle" data-param="bypass" data-label="B3" data-disabled="true"></div>').then(function () {
      var t = $("#t1"); eq(t.getAttribute("role"), "switch"); eq(t.getAttribute("aria-checked"), "false");
      var led = $(".led", t), cs = getComputedStyle(led); assert(Math.abs(parseFloat(cs.width) - 2 * rem()) < .1, "switch track is 2rem wide: " + cs.width); eq(cs.boxShadow, "none"); eq(getComputedStyle(led, "::after").backgroundImage, "none");
      t.click(); return T.settle().then(function () {
        eq(t.getAttribute("aria-checked"), "true"); eq(lastSet(), "On"); kd(t, " "); return T.settle();
      }).then(function () {
        eq(t.getAttribute("aria-checked"), "false"); assert($("#t2").classList.contains("apc-psw--button"), "button variant");
        eq($("#t3").getAttribute("aria-disabled"), "true"); var n = sets().length; $("#t3").click(); kd($("#t3"), " "); return T.sleep(20).then(function () { eq(sets().length, n, "disabled toggle ignores input"); });
      });
    });
  });

  test("existing panels are flat too: context panel (open from a knob), toasts and the selector menu have no gradient/shadow/glow and square corners", function () {
    return start('<div id="k" data-apc="knob" data-param="cutoff_hz" data-label="C"></div><div id="e" data-apc="selector" data-param="osc_wave" data-label="W"></div>').then(function () {
      APC.toast.error("flat toast"); APC.toast.info("info");
      $("#k").dispatchEvent(new MouseEvent("contextmenu", { bubbles: true, cancelable: true, clientX: 100, clientY: 100 }));
      return T.settle();
    }).then(function () {
      var panel = APC.context.panel(); assert(panel, "context panel is open");
      $(".apc-flip-cap", $("#e")).click();
      var menu = $(".apc-menu"); assert(menu, "selector menu");
      var bad = [];
      [panel, menu, $(".apc-toast"), $(".apc-toast--error")].forEach(function (root) {
        [root].concat($$("*", root)).forEach(function (n) {
          if (n.classList && /\bapc-swatch\b/.test(n.className)) return;          /* colour-blind dash patterns are functional, not decoration */
          var cs = getComputedStyle(n);
          if (cs.boxShadow !== "none") bad.push("shadow " + n.className);
          if (cs.backgroundImage !== "none") bad.push("bg-image " + n.className);
          if (cs.textShadow !== "none") bad.push("text-shadow " + n.className);
          if (/\bapc-(ctx|menu|toast)\b/.test(n.className) && cs.borderTopLeftRadius !== "0px") bad.push("radius " + n.className);
        });
      });
      eq(bad, [], "flat");
      APC.controls.closeMenu(false);
    });
  });

  T.run();
})();
</script>
